# Aigoraweave - Entorno aislado de desarrollo LinkedIn

server.address=127.0.0.1
server.port=8085

# Base de datos H2 independiente
spring.datasource.url=jdbc:h2:mem:aigoraweave_linkedin_dev;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No utilizar dialectos Oracle ni PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Evitar operaciones reales en OCI
oci.os.mode=mock

# Motor de IA local
ai.service.base-url=http://127.0.0.1:18001
