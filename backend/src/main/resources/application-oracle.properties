# Datos de conexion desde el .env
spring.datasource.url=${ORACLE_DB_URL}
spring.datasource.username=${ORACLE_DB_USER}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Dialecto y estrategia de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# OCI Object Storage
oci.os.namespace=${OCI_OS_NAMESPACE:}
oci.os.bucket=${OCI_OS_BUCKET:communitylab-local}
oci.os.region=${OCI_REGION:}

# Almacenamiento real en Oracle Cloud
oci.os.mode=${OCI_OS_MODE:mock}

# Dialecto Hibernate para Oracle Database
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
