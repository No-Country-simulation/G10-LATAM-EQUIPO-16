# Driver JDBC delgado de Oracle (thin driver)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Dialecto para Oracle Autonomous Database
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Verifica el esquema pero NO lo modifica (seguro en prod)
spring.jpa.hibernate.ddl-auto=validate

# Deshabilita el log de SQL en producción para no exponer datos sensibles
spring.jpa.show-sql=false

# Ruta al wallet descargado desde Oracle Cloud; requerido para conexión TLS
spring.datasource.hikari.connection-properties=oracle.net.wallet_location=${WALLET_DIR};oracle.net.tns_admin=${WALLET_DIR}