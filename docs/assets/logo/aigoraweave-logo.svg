<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Aigoraweave</title>
  <desc id="d">Una letra A formada por dos hilos que se cruzan, con un destello que representa la IA: las conversaciones se tejen en historias.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --muted:#475569; --blue:#2563eb; --teal:#0d9488; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --ink:#f1f5f9; --muted:#94a3b8; --blue:#60a5fa; --teal:#2dd4bf; }
    }
    .name { font: 700 58px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -1px; }
    .sub  { font: 400 19px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .t { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  </style>

  <!-- Isotipo: A tejida. El travesaño pasa por encima de la pata izquierda y por debajo de la derecha -->
  <g transform="translate(18 10)">
    <path class="t" d="M26 142 L70 22" stroke="var(--teal)" stroke-width="18"/>
    <path class="t" d="M28 104 L98 104" stroke="var(--bg)" stroke-width="26"/>
    <path class="t" d="M28 104 L98 104" stroke="var(--blue)" stroke-width="14"/>
    <path class="t" d="M70 22 L114 142" stroke="var(--blue)" stroke-width="18"/>
    <path d="M122 6 L126 20 L140 24 L126 28 L122 42 L118 28 L104 24 L118 20 Z" fill="var(--teal)"/>
  </g>

  <text class="name" x="196" y="96"><tspan fill="var(--blue)">Ai</tspan><tspan fill="var(--ink)">gora</tspan><tspan fill="var(--teal)">weave</tspan></text>
  <text class="sub" x="198" y="132" fill="var(--muted)">Del chat de la comunidad al contenido publicable</text>
</svg>
