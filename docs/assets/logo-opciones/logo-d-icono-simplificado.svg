<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="220" height="240" role="img" aria-labelledby="t d">
  <title id="t">CommunityLab</title>
  <desc id="d">Icono: un mensaje inclinado vierte su contenido en un matraz de laboratorio.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --muted:#475569; --blue:#2563eb; --teal:#0d9488; --glyph:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --ink:#f1f5f9; --muted:#94a3b8; --blue:#60a5fa; --teal:#2dd4bf; --glyph:#0d1117; }
    }
    .name { font: 700 58px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -1px; }
    .sub  { font: 400 19px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <g transform="translate(20 30)">
    <defs><clipPath id="flb"><path d="M96 22V62L56 128Q48 146 70 146H150Q172 146 164 128L124 62V22Z"/></clipPath></defs>
    <!-- matraz -->
    <g transform="translate(0 40)">
      <g clip-path="url(#flb)"><rect x="0" y="96" width="220" height="60" fill="var(--teal)"/></g>
      
      <g fill="var(--glyph)"><circle cx="96" cy="118" r="5.5"/><circle cx="118" cy="122" r="5.5"/><circle cx="106" cy="136" r="5.5"/></g>
    
      <path d="M96 22V62L56 128Q48 146 70 146H150Q172 146 164 128L124 62V22" fill="none" stroke="var(--blue)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="86" y="10" width="48" height="12" rx="6" fill="var(--blue)"/>
    </g>
    <!-- icono de mensaje inclinado que se vacía en el matraz -->
    <g transform="translate(56 22) rotate(28)">
      <path d="M-24 -23H24a10 10 0 0 1 10 10V13a10 10 0 0 1-10 10H-10L-26 35V23h2a10 10 0 0 1-10-10V-13a10 10 0 0 1 10-10Z" fill="var(--blue)"/>
      <g fill="var(--glyph)"><circle cx="-14" cy="0" r="4"/><circle cx="0" cy="0" r="4"/><circle cx="14" cy="0" r="4"/></g>
    </g>
    <!-- gotas que caen hacia el matraz -->
    <g fill="var(--teal)">
      <circle cx="96" cy="46" r="4.2"/><circle cx="102" cy="58" r="3.6"/><circle cx="109" cy="72" r="3"/><circle cx="110" cy="88" r="2.4"/>
    </g>
  </g>
</svg>
