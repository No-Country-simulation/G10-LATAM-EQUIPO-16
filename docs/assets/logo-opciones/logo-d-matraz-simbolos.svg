<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="t d">
  <title id="t">CommunityLab</title>
  <desc id="d">Un icono de mensaje inclinado vierte su contenido en un matraz de laboratorio, donde flotan símbolos genéricos de canales: mensaje, etiqueta y red.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --muted:#475569; --blue:#2563eb; --teal:#0d9488; --glyph:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --ink:#f1f5f9; --muted:#94a3b8; --blue:#60a5fa; --teal:#2dd4bf; --glyph:#0d1117; }
    }
    .name { font: 700 58px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -1px; }
    .sub  { font: 400 19px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <g transform="translate(20 30)">
    <defs><clipPath id="fla"><path d="M96 22V62L56 128Q48 146 70 146H150Q172 146 164 128L124 62V22Z"/></clipPath></defs>
    <!-- matraz -->
    <g transform="translate(0 40)">
      <g clip-path="url(#fla)"><rect x="0" y="96" width="220" height="60" fill="var(--teal)"/></g>
      
      <!-- símbolos genéricos flotando en el líquido -->
      <path d="M84 107h16a5 5 0 0 1 5 5v6a5 5 0 0 1-5 5h-8l-5 5v-5h-3a5 5 0 0 1-5-5v-6a5 5 0 0 1 5-5z" fill="var(--glyph)"/>
      <g stroke="var(--glyph)" stroke-width="2.6" stroke-linecap="round" fill="none">
        <path d="M125 108l-2 16M135 108l-2 16M118 113h20M117 119h20"/>
      </g>
      <g stroke="var(--glyph)" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path d="M100 135l14-6 16 7"/>
      </g>
      <g fill="var(--glyph)"><circle cx="100" cy="135" r="3.4"/><circle cx="114" cy="129" r="3.4"/><circle cx="130" cy="136" r="3.4"/></g>
    
      <path d="M96 22V62L56 128Q48 146 70 146H150Q172 146 164 128L124 62V22" fill="none" stroke="var(--blue)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="86" y="10" width="48" height="12" rx="6" fill="var(--blue)"/>
    </g>
    <!-- icono de mensaje inclinado que se vacía en el matraz -->
    <g transform="translate(56 22) rotate(28)">
      <path d="M-24 -23H24a10 10 0 0 1 10 10V13a10 10 0 0 1-10 10H-10L-26 35V23h2a10 10 0 0 1-10-10V-13a10 10 0 0 1 10-10Z" fill="var(--blue)"/>
      <g fill="var(--glyph)"><circle cx="-14" cy="0" r="4"/><circle cx="0" cy="0" r="4"/><circle cx="14" cy="0" r="4"/></g>
    </g>
    <!-- gotas que caen hacia el matraz -->
    <g fill="var(--teal)">
      <circle cx="96" cy="46" r="4.2"/><circle cx="102" cy="58" r="3.6"/><circle cx="109" cy="72" r="3"/><circle cx="110" cy="88" r="2.4"/>
    </g>
  </g>
  <text class="name" x="236" y="124"><tspan fill="var(--ink)">Community</tspan><tspan fill="var(--teal)">Lab</tspan></text>
  <text class="sub" x="238" y="162" fill="var(--muted)">Del chat de la comunidad al contenido publicable</text>
</svg>
